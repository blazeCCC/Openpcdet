DATASET: 'KLDataset'
DATA_PATH: '../data/kl'

VERSION: 'v1.0-mini'
MAX_SWEEPS: 10
PRED_VELOCITY: True
SET_NAN_VELOCITY_TO_ZEROS: True
FILTER_MIN_POINTS_IN_GT: 0

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [kl_infos_train.pkl],
    'test': [kl_infos_val.pkl],
}

POINT_CLOUD_RANGE: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

BALANCED_RESAMPLING: True 

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          DB_INFO_PATH:
              - kl_dbinfos.pkl
          PREPARE: {
             filter_by_min_points: [
                    'Pedestrian:5', 'Car:5', 'IGV-Full:10', 'Truck:10',
                    'Trailer-Empty:10', 'Container:10', 'Trailer-Full:105',
                    'IGV-Empty:10'
             ],
          }

          SAMPLE_GROUPS: [
                'Pedestrian:36', 'Car:7', 'IGV-Full:1', 'Truck:26',
                'Trailer-Empty:19', 'Container:32', 'Trailer-Full:8',
                'IGV-Empty:4'
          ]

          NUM_POINT_FEATURES: 5
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.3925, 0.3925]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]


POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
}


DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': True
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.2]
      MAX_POINTS_PER_VOXEL: 10
      MAX_NUMBER_OF_VOXELS: {
        'train': 60000,
        'test': 60000
      }
